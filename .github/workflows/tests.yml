name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Hermes commit the plugin is checked against (README "Checked against").
  HERMES_COMMIT: 22063fc099ec9ad8357d7f8f6e6248a0400680d3

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # Read-only checkout of Hermes for the integration test. Hermes refuses wheel builds,
      # so it is put on PYTHONPATH instead of pip-installed; ruamel.yaml is the only
      # dependency the plugin manager needs.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_COMMIT }}
          path: .hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "ruamel.yaml==0.18.16"

      # Tests run in an empty network namespace, so any network access fails.
      - name: pytest (no network)
        run: |
          sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" \
            PYTHONPATH="$GITHUB_WORKSPACE/.hermes-agent" \
            python -m pytest tests -v -rs

  # Hermes' own plugin checks. Its CLI dependencies need Python 3.14.
  hermes-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_COMMIT }}
          path: .hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Hermes
        run: |
          python -m pip install uv
          uv venv -p "$(command -v python)" "$RUNNER_TEMP/hermes-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/hermes-venv" uv pip install -e .hermes-agent

      # Plugin enabled through config.yaml in a temporary HERMES_HOME; no network.
      - name: hermes plugins validate / doctor (no network)
        run: |
          sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" \
            .github/scripts/hermes-tools.sh "$RUNNER_TEMP/hermes-venv/bin/hermes"
