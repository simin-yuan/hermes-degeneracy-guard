name: degeneracy-guard
version: 1.1.0
description: Detects repetition loops in model output, blocks tool calls with degenerate arguments, replaces flagged output with a short notice, records incidents locally and warns when a session grows too long.
author: "Simin (Simon) Yuan"
provides_hooks:
  - on_stream_delta
  - transform_llm_output
  - post_llm_call
  - pre_tool_call
  - pre_llm_call
